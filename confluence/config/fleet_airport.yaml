# Confluence fleet integration config - airport terminal.
# Same four vendors and interfaces as the warehouse fleet, different jobs.
# Confluence itself is unchanged between sites: only this file and the site map differ.

site: airport             # site map: confluence/sites/airport.py
log_dir: ~/.ros/confluence
dashboard_port: 8080
auto_tasks: true
task_interval_s: 10

robots:
  - id: r1
    vendor: Nimbus Robotics
    model: GuideBot G2
    protocol: ros2
    endpoint: {namespace: /r1}
    capabilities: [guide, patrol]
    priority: 3
    home_charger: CHG1

  - id: r2
    vendor: Atlas Mobility
    model: ScrubMaster S-600
    protocol: rest
    endpoint: {url: "http://127.0.0.1:8081", poll_hz: 2}
    capabilities: [clean, patrol]
    priority: 1
    home_charger: CHG2

  - id: r3
    vendor: Tugwell
    model: TX-2 trolley tug
    protocol: tcp
    endpoint: {host: 127.0.0.1, port: 9090, battery_v_empty: 22.0, battery_v_full: 25.2}
    capabilities: [tow]
    priority: 4
    home_charger: CHG3

  - id: r4
    vendor: Kessler Intralogistics
    model: K-Bag 8 baggage AGV
    protocol: vda5050
    endpoint: {broker_host: 127.0.0.1, broker_port: 1883, interface: uagv,
               manufacturer: Kessler, serial_number: KL12-0004}
    capabilities: [baggage]
    priority: 2
    home_charger: CHG4
